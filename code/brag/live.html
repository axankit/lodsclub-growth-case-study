<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:B;src:url(fonts/bricolage-grotesque-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:F;src:url(fonts/figtree-latin-700-normal.woff2);font-weight:700}
html,body{margin:0;background:#17141c}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#17141c;font-family:B,sans-serif;color:#f6f6f4}
#stage *{position:absolute;box-sizing:border-box}
#stage b,#stage br{position:static}
.glow{inset:0;background:radial-gradient(55% 35% at 50% 62%,rgba(214,242,90,.16),transparent 70%),radial-gradient(40% 30% at 20% 20%,rgba(229,38,45,.18),transparent 70%)}
.cap{left:70px;right:70px;text-align:center;font-weight:800;letter-spacing:-.045em;line-height:.95;font-size:104px}
.cap b{color:#d6f25a}
.phone{left:220px;top:560px;width:640px;height:1214px;border-radius:84px;background:#0b0a0e;border:4px solid #3a3542;box-shadow:0 60px 120px rgba(0,0,0,.6);transform-origin:50% 0}
.screen{left:16px;top:16px;width:600px;height:1174px;border-radius:68px;overflow:hidden;background:#f6f6f4}
.screen .pg{left:0;top:0;width:600px}
.bar{left:0;bottom:0;width:600px;height:89px}
.notch{left:230px;top:30px;width:140px;height:38px;border-radius:99px;background:#0b0a0e}
.tap{width:120px;height:120px;border-radius:50%;border:6px solid #e5262d;background:rgba(229,38,45,.18);margin:-60px 0 0 -60px}
.wipe{left:0;top:0;width:600px;height:1174px;background:#f6f6f4}
.pill{left:250px;width:580px;height:120px;border-radius:99px;background:#d6f25a;color:#17141c;font-weight:800;font-size:60px;display:flex;align-items:center;justify-content:center;letter-spacing:-.03em}
.sub{left:0;right:0;text-align:center;font-family:F;font-weight:700;font-size:46px;color:#d8d3dc}
.dip{inset:0;background:#17141c}
</style></head><body><div id="stage"></div>
<script src="common.js"></script>
<script>
const K=600/390; // css px -> screen px
el('div','glow');
const phone=el('div','phone');const screen=el('div','screen',phone);
const pg={home:img('site/home.png','pg',screen),style:img('site/style.png','pg',screen),pdp:img('site/pdp.png','pg',screen)};
const bar=img('site/bar.png','bar',screen);
const wipe=el('div','wipe',screen);
const tap=el('div','tap',screen);
el('div','notch',phone);
const c0=el('div','cap',null,'Our new website<br>is <b>live.</b>');c0.style.top='250px';
const c1=el('div','cap',null,'Shop by <b>style</b>');c1.style.top='330px';
const c2=el('div','cap',null,'Find your <b>vibe</b>');c2.style.top='330px';
const c3=el('div','cap',null,'Made for your<br><b>exact phone</b>');c3.style.top='270px';
const c4=el('div','cap',null,'Unboxed on<br><b>Instagram</b>');c4.style.top='270px';
const o1=el('div','cap',null,'lodsclub<b>.com</b>');o1.style.cssText+='top:330px;font-size:150px';
const o2=el('div','sub',null,'Cases ₹249 · Tees ₹399 · Free delivery');o2.style.top='520px';
const pill=el('div','pill',null,'Go have a look');pill.style.top='640px';
const dip=el('div','dip');
window.SCENES=[{name:'l1',start:0,end:2.5},{name:'l2',start:2.5,end:5},{name:'l3',start:5,end:8},{name:'l4',start:8,end:11.5},{name:'l5',start:11.5,end:14},{name:'l6',start:14,end:18}];
const ALL=[c0,c1,c2,c3,c4,o1,o2,pill,dip];
function show(name,scroll){for(const k in pg)set(pg[k],{show:k===name,y:-scroll*K});}
function tapAt(t,t0,x,y,scroll){const p=prog(t,t0,.45);if(p<=0||p>=1)return set(tap,{show:false});set(tap,{x:x*K,y:(y-scroll)*K,s:lerp(.4,1.3,eOut(p)),o:1-p});}
window.render=function(t){
  ALL.forEach(e=>set(e,{show:false}));set(tap,{show:false});set(wipe,{show:false});
  let ph={y:0,s:1,o:1};
  if(t<2.5){
    const a=eOut(prog(t,0,.7));ph={y:(1-a)*700,s:1,o:1};show('home',0);
    line(c0,t,0.15,2.5,40);
  }else if(t<5){
    const s=lerp(0,860,eInOut(prog(t,2.7,1.4)));show('home',s);line(c1,t,2.55,5,40);
    tapAt(t,4.35,195,1039,860);
  }else if(t<8){
    const s=lerp(0,560,eInOut(prog(t,6.2,1.5)));show('style',s);line(c2,t,5.05,8,40);
    tapAt(t,5.55,88,535,0);
  }else if(t<11.5){
    const s=lerp(0,560,eInOut(prog(t,8.3,1.1)));show('pdp',s);line(c3,t,8.05,11.5,40);
    tapAt(t,9.7,149,766,560);tapAt(t,10.6,248,948,560);
    if(t>=10.6&&t<11.05) tapAt(t,10.6,248,948,560); else if(t>=9.7&&t<10.15) tapAt(t,9.7,149,766,560);
  }else if(t<14){
    const s=lerp(1960,2110,eInOut(prog(t,11.6,1.6)));show('home',s);line(c4,t,11.55,14,40);
  }else{
    show('home',0);const a=eInOut(prog(t,14,.7));ph={y:lerp(0,330,a),s:lerp(1,.78,a),o:1};
    line(o1,t,14.3,18.01,40);line(o2,t,14.8,18.01,30);
    const c=prog(t,15.3,.45);set(pill,{s:lerp(.7,1,eBack(c))*(1+0.025*Math.sin((t-15.8)*Math.PI*4)*(t>15.8?1:0)),o:clamp(c*2)});
  }
  set(phone,ph);
  // screen wipe on page change
  let w=0;[5,8,11.5].forEach(c=>{w=Math.max(w,1-Math.abs(t-c)/0.12)});if(w>0)set(wipe,{o:w});
  let d=0;[14].forEach(c=>{d=Math.max(d,0)});
};
window.render(0);
</script></body></html>
